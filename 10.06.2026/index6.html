<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css"/>
</head>
<body class="p-6 bg-gray-200">
    <div class="p-6 bg-white">
        <h1 class="text-xl font-bold">Kullanıcı Listesi Fetch Get</h1>
        <div class="mb-4">
            <input type="text" id="search-input" placeholder="İsim İle Ara" class="p-2 border">
        </div>
        <button id="btn-load" class="p-2 bg-blue-200 mb-4" >Listeyi Yükle</button>
        <ul id="user-list" class="p-2 bg-blue-200 mb-4">
            <li>Henüz Ali Hocam Yapamadı</li>
        </ul>
    </div>

    <script>
        let tumKullanicilar=[];
        const yedekKullanicilar=
        [
            {'id':1, 'name':'Ali Yılmaz', "email":'ali@gmail.com','sehir':'Çorum'},
            {'id':2, 'name':'Ece Yılmaz', "email":'ece@gmail.com','sehir':'İstanbul'},
            {'id':3, 'name':'Ezgi Yılmaz', "email":'ezgi@gmail.com','sehir':'Hatay'},
            {'id':4, 'name':'Dilek Yılmaz', "email":'dilek@gmail.com','sehir':'Malatya'},
        ];

        const listeyiCiz=(kullanicilar)=>
        {
            const listElement=document.getElementById('user-list');
            listElement.innerHTML='';
            if(kullanicilar.length === 0)
        {
            listElement.innerHTML=`<li>Eşlenen Kullanıcı Bulunamadı</li>`;
            return;
        }

        kullanicilar.forEach(user=>
        {
            const li =document.createElement('li');
            li.innerHTML=`<strong>${user.name}</strong> - E-posta: ${user.email} (Şehir: ${user.sehir})`;
            listElement.appendChild(li);
        })
        

        }
        const kullanicilariYukle=async()=>
        {
            const listElement=document.getElementById('user-list');
            listElement.innerHTML=`<li>Kullanıcılar yükleniyor....</li>`;

            try{
                const response=await fetch('https://kodusta.com/api/kullanicilar.json');
                if(!response.ok){
                    throw new Error('Sunucu hatasi'+response.status);
                }
                tumKullanicilar = await response.json();
            } catch(hata){
                console.warn('CORS engeli veya bağlantı hatası, Yedek Veriler Kullanılıcak');
                tumKullanicilar.yedekKullanicilar;

            }
            listeyiCiz(tumKullanicilar);
        }

        document.getElementById('search-input').addEventListener('input',(e)=>{
            const aramaKelimesi=e.target.value.toLowerCase();
            const filtrelenmis=tumKullanicilar.filter(user=>user.name.toLowerCase().includes(aramaKelimesi));
            listeyiCiz(filtrelenmis);
        })
        document.getElementById('btn-load').addEventListener('click',kullanicilariYukle);







    </script>
    
</body>
</html>
